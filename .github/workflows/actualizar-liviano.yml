name: Actualizar cada 30 min (pipeline completo)

# El dashboard se regenera cada 30 minutos con pipeline completo:
# recopilar resultados -> predecir hoy -> generar dashboard (que
# consulta ESPN en vivo para el marcador de la pestana Hoy, con
# color verde/azul segun estado).
#
# Antes del pipeline del dia tambien se corre la prediccion de
# MANANA (predict.py --fecha manana) para que exista
# data/predicciones_{manana}.json y la pestana Manana pueda
# mostrar prediccion + overperformance. Se corre primero para que
# el cache fijo (predicciones_cache.json) quede con los partidos
# de HOY al final de la corrida.
#
# El workflow principal (actualizar.yml) sigue encargado de sus
# 2 corridas completas diarias.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Serializa las corridas: si una tarda mas de 30 min (predict consulta
# ~660 endpoints de ESPN), la siguiente espera en cola en vez de
# correr en paralelo (evita carreras de git push y picos de trafico).
concurrency:
  group: actualizar-30min
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (cada 30 min)
        run: |
          python predict.py --fecha $(TZ=America/Guayaquil date -d tomorrow +%F)
          python actualizar.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p data/historial_partidos
          touch data/.gitkeep data/historial_partidos/.gitkeep
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "Auto-update 30min: $(date -u +%Y-%m-%d %H:%M)"
            git push
          fi
